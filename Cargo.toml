[package]
name = "anr_tool"
version = "0.1.0"
edition = "2021"
authors = []
description = ""
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
debug-assertions = false
overflow-checks = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
rayon = "1.12"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
filetime = "0.2"
walkdir = "2.5"
chrono = "0.4"
rustix = { version = "1.1", features = ["process", "fs", "param"] }
signal-hook = "0.4"
ctrlc = "3.5"
libc = "0.2"
regex = "1.13"
tokio = { version = "1.53", features = ["full"] }
fs4 = { version = "1.1", features = ["sync"] }
notify = "8.2"
